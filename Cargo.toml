[workspace]
resolver = "3"
members = ["crates/simply-voice", "crates/sv"]

# For the `sv` crate. The `simply-voice` library keeps its own manifest
# (edition, version, dependencies), so lumina's git dependency sees it unchanged.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/simply-audio/simply-voice"

[workspace.dependencies]
simply-voice = { path = "crates/simply-voice" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.23"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
hound = "3.5"
rodio = "0.20"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Candle, moshi and pocket-tts are unusably slow unoptimised; the local
# models run in dev builds and tests too.
[profile.dev.package."*"]
opt-level = 3
