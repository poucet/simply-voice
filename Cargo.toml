[package]
name = "simply-voice"
version.workspace = true
edition.workspace = true

[features]
default = []
whisper = ["dep:whisper-rs"]
voxtral = ["dep:reqwest", "dep:base64", "dep:serde_json", "dep:tokio-tungstenite", "dep:futures-util", "dep:url"]
gemini = ["dep:reqwest", "dep:base64", "dep:serde_json", "dep:tokio-tungstenite", "dep:futures-util"]
elevenlabs = ["dep:reqwest", "dep:serde_json"]
pocket-tts = ["dep:pocket-tts", "dep:candle", "dep:hf-hub"]
kyutai = [
    "dep:moshi",
    "dep:candle",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:sentencepiece-model",
    "dep:hf-hub",
    "dep:serde_json",
]
# Apple Silicon acceleration for the local-model providers.
metal = ["candle?/metal", "candle-nn?/metal", "pocket-tts?/metal"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Optional provider deps
whisper-rs = { version = "0.15.1", optional = true }
reqwest = { workspace = true, features = ["rustls-tls", "multipart"], optional = true }
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { workspace = true, optional = true }
url = { workspace = true, optional = true }

# Local-model providers (pocket-tts TTS, Kyutai streaming STT)
pocket-tts = { version = "0.6", optional = true }
moshi = { version = "0.6.1", optional = true }
candle = { version = "0.9.1", package = "candle-core", optional = true }
candle-nn = { version = "0.9.1", optional = true }
candle-transformers = { version = "0.9.1", optional = true }
# Pure-Rust SentencePiece .model parser (prost-based). Deliberately NOT the
# `sentencepiece` C++ binding: its libprotobuf clashes with onnxruntime's
# (loaded via fastembed) and aborts on the version handshake at startup.
sentencepiece-model = { version = "0.1.4", optional = true }
hf-hub = { version = "0.4.3", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
