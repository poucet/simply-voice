[package]
name = "simply-voice-cli"
description = "sv: speak, listen and pick audio devices from the command line, for people and agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sv"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
clap.workspace = true
cpal.workspace = true
hound.workspace = true
rodio.workspace = true
simply-voice = { workspace = true, features = ["kyutai", "pocket-tts", "metal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Whisper (whisper.cpp) as a batch `stt.backend`; off by default — it builds
# whisper.cpp with cmake.
whisper = ["simply-voice/whisper"]

[dev-dependencies]
async-trait.workspace = true
